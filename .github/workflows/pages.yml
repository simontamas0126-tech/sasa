name: Deploy SIMON'S ORDER

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          curl --fail --location --retry 3 \
            'https://ozhpsqfvgtqvhmrjzsit.supabase.co/functions/v1/simons-order/' \
            --output site/index.html
          cp brand.css site/brand.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text()
          html = html.replace('</head>', '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="brand.css?v=5-mobile-input-fix"></head>')

          # Mobile browsers can drop the virtual keyboard when native number inputs
          # are updated dynamically. Keep numeric keyboards via inputmode, but use
          # stable text inputs so focus is preserved while typing.
          html = html.replace('type="number"', 'type="text" inputmode="decimal" autocorrect="off" autocomplete="off"')

          old_plan = "$$('[data-p]').forEach(e=>e.oninput=x=>{plan[+x.target.dataset.p]=Math.max(0,+x.target.value||0);render()});"
          new_plan = "$$('[data-p]').forEach(e=>{e.oninput=x=>{let i=+x.target.dataset.p,v=Number(String(x.target.value).replace(',','.'));plan[i]=Number.isFinite(v)&&v>=0?v:0};e.onchange=x=>{let i=+x.target.dataset.p,s=$('#store').value,wa=D.reduce((z,_,j)=>z+ravg(s,j),0),wp=plan.reduce((a,b)=>a+b,0),dd=wa?(wp/wa-1)*100:0;$('#wa').textContent=money(wa);$('#wp').textContent=money(wp);$('#wd').textContent=(dd>=0?'+':'')+num(dd,1)+'% AZ ÁTLAGHOZ';$('#wb').textContent=num(D.reduce((z,_,j)=>z+calc(j,'bun'),0),0)+' DB';$('#wf').textContent=num(D.reduce((z,_,j)=>z+plan[j]*fr(s,j),0),0)+' ADAG';let av=ravg(s,i),df=av?(plan[i]/av-1)*100:0,info=x.target.nextElementSibling;if(info)info.textContent=(df>=0?'+':'')+num(df,0)+'% • ≈ '+num(calc(i,'bun'),0)+' BURGER';orders()}});"
          html = html.replace(old_plan, new_plan)

          old_stock = "$$('[data-stock]').forEach(e=>e.oninput=x=>{let q=x.target.dataset.stock.split('|');inv[q[0]]||={};inv[q[0]][q[1]]=Math.max(0,+x.target.value||0);orders()})"
          new_stock = "$$('[data-stock]').forEach(e=>{e.oninput=x=>{let q=x.target.dataset.stock.split('|'),v=Number(String(x.target.value).replace(',','.'));v=Number.isFinite(v)&&v>=0?v:0;inv[q[0]]||={};inv[q[0]][q[1]]=v};e.onchange=x=>orders()})"
          html = html.replace(old_stock, new_stock)

          # Accept Hungarian decimal comma in every numeric-looking text field.
          html = html.replace("Math.round(+$('#rev').value)", "Math.round(Number(String($('#rev').value).replace(',','.')))")
          html = html.replace("Math.round(+$('#burg').value)", "Math.round(Number(String($('#burg').value).replace(',','.')))")
          html = html.replace("Math.round(+$('#frc').value)", "Math.round(Number(String($('#frc').value).replace(',','.')))")

          p.write_text(html)
          PY
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
